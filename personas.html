<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Glance TV — Persona Feed</title>
<style>
  :root {
    --violet-100: #EFEAFF;
    --violet-200: #D8CCFF;
    --violet-300: #B5A3FF;
    --violet-400: #9B86FF;
    --violet-500: #7E68F2;
    --violet-600: #5F4BD9;
    --bg-0: #07050C;
    --ink-0: #FFFFFF;
    --ink-1: rgba(255,255,255,0.82);
    --ink-2: rgba(255,255,255,0.56);
    --ink-3: rgba(255,255,255,0.36);

    /* Persona palette - drives mascot glow, pill, accents */
    --persona: var(--violet-400);
    --persona-glow: rgba(155,134,255,0.55);
    --persona-soft: rgba(155,134,255,0.16);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; overflow: hidden; background: var(--bg-0); color: var(--ink-0);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", sans-serif;
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
  }
  body::after {
    content: ""; position: fixed; inset: 0; z-index: 100; pointer-events: none;
    opacity: 0.035; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }

  .stage { position: fixed; inset: 0; overflow: hidden; }

  /* ============= IMMERSIVE MODE ============= */
  .card {
    position: absolute; inset: 0; opacity: 0; transform: scale(1.018);
    transition: opacity 1.0s cubic-bezier(0.32,0.72,0,1), transform 7s cubic-bezier(0.22,0.61,0.36,1);
    pointer-events: none;
  }
  .card.active { opacity: 1; transform: scale(1); pointer-events: auto; }

  .card-image {
    position: absolute; inset: 0; background-size: cover; background-position: center;
    transform: scale(1.07); transition: transform 12s linear;
  }
  .card.active .card-image { transform: scale(1.0); }

  .card::before {
    content: ""; position: absolute; inset: 0; z-index: 1;
    background: linear-gradient(180deg, rgba(7,5,12,0.4) 0%, rgba(7,5,12,0) 24%, rgba(7,5,12,0) 44%, rgba(7,5,12,0.6) 78%, rgba(7,5,12,0.94) 100%);
  }
  .card::after {
    content: ""; position: absolute; inset: 0; z-index: 1;
    background: linear-gradient(90deg, rgba(7,5,12,0.55) 0%, rgba(7,5,12,0) 42%, rgba(7,5,12,0) 100%);
  }

  /* Card content positioning */
  .card-content {
    position: relative; z-index: 2; width: 100%; height: 100%;
    padding: 96px 112px; display: flex; flex-direction: column; justify-content: flex-end;
  }
  .card-title {
    font-size: 84px; font-weight: 600; line-height: 1.0; letter-spacing: -0.035em;
    max-width: 1100px; color: var(--ink-0); opacity: 0; transform: translateY(18px);
    transition: opacity 1.0s 0.3s cubic-bezier(0.32,0.72,0,1), transform 1.0s 0.3s;
  }
  .card.active .card-title { opacity: 1; transform: translateY(0); }
  .card-sub {
    margin-top: 18px; font-size: 20px; font-weight: 400; color: var(--ink-1);
    max-width: 680px; line-height: 1.4; letter-spacing: -0.005em; opacity: 0; transform: translateY(12px);
    transition: opacity 1.0s 0.5s cubic-bezier(0.32,0.72,0,1), transform 1.0s 0.5s;
  }
  .card.active .card-sub { opacity: 1; transform: translateY(0); }

  /* Layout variants */
  .card.layout-center .card-content { align-items: center; text-align: center; padding-bottom: 140px; }
  .card.layout-center .card-title { max-width: 1000px; }
  .card.layout-center .card-sub { max-width: 640px; }
  .card.layout-br .card-content { align-items: flex-end; text-align: right; }
  .card.layout-br .card-title, .card.layout-br .card-sub { margin-left: auto; }

  /* AGENT LINE */
  .agent-line {
    display: flex; align-items: center; gap: 14px;
    font-family: "New York", Georgia, serif; font-size: 21px; font-style: italic;
    color: var(--violet-100); letter-spacing: -0.012em; line-height: 1.35;
    max-width: 920px; margin-top: 36px; min-height: 38px;
    position: relative; z-index: 5; pointer-events: none; opacity: 0; transform: translateY(8px);
    transition: opacity 0.7s 0.9s cubic-bezier(0.32,0.72,0,1), transform 0.7s 0.9s;
  }
  .card.active .agent-line { opacity: 1; transform: translateY(0); }
  .typed-text { display: inline-block; line-height: 1.35; text-align: left; }
  .card.layout-center .agent-line { margin: 36px auto 0; }
  .card.layout-br .agent-line { margin-left: auto; }

  /* MASCOT */
  .agent-mascot {
    flex-shrink: 0; display: inline-block; position: relative; width: 38px; height: 38px;
    z-index: 2; will-change: transform;
  }
  .agent-mascot::before {
    content: ""; position: absolute; inset: -4px; border-radius: 50%;
    background: conic-gradient(from 0deg, var(--persona), color-mix(in srgb, var(--persona) 60%, white) 90deg, var(--persona) 180deg, color-mix(in srgb, var(--persona) 70%, white) 270deg, var(--persona) 360deg);
    filter: blur(7px); opacity: 0.55; z-index: -1; animation: glyphSpin 7s linear infinite;
    transition: background 0.8s ease;
  }
  @keyframes glyphSpin { to { transform: rotate(360deg); } }
  .agent-mascot::after {
    content: ""; position: absolute; inset: -6px; border-radius: 50%;
    background: radial-gradient(circle, var(--persona-glow) 0%, transparent 65%);
    z-index: -2; animation: mascotGlow 3.6s ease-in-out infinite;
    transition: background 0.8s ease;
  }
  @keyframes mascotGlow { 0%,100% {opacity:0.7;} 50% {opacity:1;} }
  .mascot-svg {
    width: 100%; height: 100%; overflow: visible; animation: mascotBob 4.2s ease-in-out infinite;
    filter: drop-shadow(0 3px 8px var(--persona-glow));
    transition: filter 0.8s ease;
  }
  @keyframes mascotBob { 0%,100% {transform:translateY(0);} 50% {transform:translateY(-1.5px);} }
  .mascot-svg .m-body { transform-origin: center; transform-box: fill-box; animation: mascotBreath 3.4s ease-in-out infinite; transition: transform 0.6s cubic-bezier(0.32,0.72,0,1); }
  @keyframes mascotBreath { 0%,100% {transform:scale(1);} 50% {transform:scale(1.035);} }
  .mascot-svg .m-eyes { transform-origin: center; transform-box: fill-box; animation: mascotBlink 5.6s infinite; }
  @keyframes mascotBlink { 0%,88%,100% {transform:scaleY(1);} 91%,94% {transform:scaleY(0.1);} }
  .agent-line.is-typing .mascot-svg { animation: mascotBobTalking 1.1s ease-in-out infinite; }
  @keyframes mascotBobTalking { 0%,100% {transform:translateY(0);} 50% {transform:translateY(-2px);} }

  /* MOOD VARIANTS */
  .agent-line.mood-curious .mascot-svg { transform: rotate(-6deg); }
  .agent-line.mood-curious .mascot-svg .m-brow { transform: translateY(-1.2px); }
  .agent-line.mood-confident .mascot-svg .m-mouth { transform: scaleX(1.15); }
  .agent-line.mood-proud .mascot-svg .m-mouth { transform: scaleX(1.25) translateY(-0.4px); }
  .agent-line.mood-proud .agent-mascot::before { opacity: 0.85; animation-duration: 4s; }
  .agent-line.mood-thinking .mascot-svg .pupil { transform: translateY(-1px) translateX(0.6px); }

  /* CTA */
  .card-actions { margin-top: 32px; display: flex; align-items: center; gap: 24px; }
  .card.layout-center .card-actions { justify-content: center; }
  .card.layout-br .card-actions { justify-content: flex-end; }

  .cta-button {
    display: inline-flex; align-items: center; gap: 12px; padding: 13px 22px 13px 14px;
    background: linear-gradient(135deg, var(--persona-soft) 0%, rgba(126,104,242,0.06) 100%);
    border: 0.5px solid color-mix(in srgb, var(--persona) 40%, transparent);
    border-radius: 100px;
    font-size: 15px; font-weight: 500; color: var(--ink-0); letter-spacing: -0.008em;
    backdrop-filter: blur(32px) saturate(180%); -webkit-backdrop-filter: blur(32px) saturate(180%);
    box-shadow: 0 6px 22px var(--persona-glow), inset 0 1px 0 rgba(255,255,255,0.18);
    position: relative; opacity: 0; transform: translateY(8px); pointer-events: none;
    transition: opacity 600ms cubic-bezier(0.32,0.72,0,1), transform 600ms, box-shadow 400ms, background 0.8s ease, border-color 0.8s ease;
  }
  .cta-button.landed { opacity: 1; transform: translateY(0); pointer-events: auto; }
  .cta-button:hover { box-shadow: 0 10px 28px var(--persona-glow), inset 0 1px 0 rgba(255,255,255,0.24); }
  .cta-question {
    font-family: "New York", Georgia, serif; font-style: italic; font-weight: 400; color: var(--ink-0);
    letter-spacing: -0.012em; font-size: 16px;
  }
  .cta-yes {
    display: inline-flex; align-items: center; margin-left: 6px; padding: 5px 12px; border-radius: 100px;
    background: linear-gradient(135deg, var(--persona) 0%, color-mix(in srgb, var(--persona) 60%, black) 100%);
    color: #1B0F36;
    font-family: -apple-system, sans-serif; font-style: normal; font-size: 13px; font-weight: 600;
    box-shadow: 0 4px 14px var(--persona-glow), inset 0 1px 0 rgba(255,255,255,0.5);
    transition: background 0.8s ease, box-shadow 0.8s ease;
  }
  .cta-dock { flex-shrink: 0; width: 26px; height: 26px; display: inline-block; }

  /* CATEGORY TAG */
  .card-tag {
    position: absolute; top: 116px; left: 112px; z-index: 3; display: inline-flex; align-items: center; gap: 9px;
    padding: 7px 13px; border-radius: 100px; background: rgba(255,255,255,0.06);
    backdrop-filter: blur(28px) saturate(140%); -webkit-backdrop-filter: blur(28px) saturate(140%);
    border: 0.5px solid rgba(255,255,255,0.14); font-size: 10px; font-weight: 500; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--ink-1); opacity: 0; transform: translateY(6px);
    transition: opacity 0.9s 0.3s cubic-bezier(0.32,0.72,0,1), transform 0.9s 0.3s;
  }
  .card.active .card-tag { opacity: 1; transform: translateY(0); }
  .card.layout-br .card-tag { left: auto; right: 112px; }
  .card-tag::before { content: ""; width: 4px; height: 4px; border-radius: 50%; background: var(--persona); transition: background 0.8s ease; }

  /* WORDMARK + TIME */
  .glance-mark { position: absolute; top: 40px; left: 56px; z-index: 50; display: flex; align-items: center; gap: 9px;
    font-size: 14px; font-weight: 500; letter-spacing: -0.01em; color: var(--ink-1); }
  .glance-mark::before { content: ""; width: 8px; height: 8px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0) 50%),
                conic-gradient(from 0deg, var(--persona), color-mix(in srgb, var(--persona) 60%, white), var(--persona));
    box-shadow: 0 0 10px var(--persona-glow); animation: glyphSpin 8s linear infinite;
    transition: background 0.8s ease, box-shadow 0.8s ease; }
  .time-mark { position: absolute; top: 40px; right: 56px; z-index: 5; font-size: 12px; font-weight: 400; color: var(--ink-2); font-variant-numeric: tabular-nums; }

  /* ============= PERSONA PILL ============= */
  .persona-pill {
    position: fixed; top: 32px; right: 56px; z-index: 200;
    display: flex; align-items: center; gap: 12px;
    background: rgba(20,15,30,0.7);
    backdrop-filter: blur(28px) saturate(160%); -webkit-backdrop-filter: blur(28px) saturate(160%);
    border: 0.5px solid color-mix(in srgb, var(--persona) 35%, rgba(255,255,255,0.14));
    border-radius: 100px;
    padding: 8px 16px 8px 8px;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.32,0.72,0,1);
    box-shadow: 0 8px 32px rgba(0,0,0,0.4), 0 0 0 1px var(--persona-soft);
  }
  .persona-pill:hover {
    transform: translateY(-1px);
    box-shadow: 0 12px 40px rgba(0,0,0,0.5), 0 0 0 1px var(--persona-soft);
  }
  .persona-pill-avatar {
    width: 32px; height: 32px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.9) 0%, transparent 50%),
                conic-gradient(from 0deg, var(--persona), color-mix(in srgb, var(--persona) 50%, white), var(--persona));
    box-shadow: 0 0 12px var(--persona-glow);
    transition: all 0.6s ease;
    flex-shrink: 0;
  }
  .persona-pill-text { display: flex; flex-direction: column; line-height: 1.2; }
  .persona-pill-label { font-size: 9px; font-weight: 600; color: var(--ink-3); letter-spacing: 0.12em; text-transform: uppercase; }
  .persona-pill-name { font-size: 14px; font-weight: 600; color: var(--ink-0); letter-spacing: -0.005em; }
  .persona-pill-chevron {
    color: var(--ink-2); margin-left: 4px; font-size: 10px; transition: transform 0.3s;
  }

  /* ============= PERSONA DRAWER ============= */
  .persona-drawer {
    position: fixed; top: 0; right: 0; bottom: 0;
    width: 460px; max-width: 90vw;
    background: rgba(15,10,24,0.96);
    backdrop-filter: blur(40px) saturate(180%); -webkit-backdrop-filter: blur(40px) saturate(180%);
    border-left: 0.5px solid rgba(255,255,255,0.08);
    z-index: 250;
    transform: translateX(100%);
    transition: transform 0.5s cubic-bezier(0.32,0.72,0,1);
    overflow-y: auto;
    box-shadow: -20px 0 60px rgba(0,0,0,0.6);
  }
  .persona-drawer.open { transform: translateX(0); }

  .drawer-header {
    padding: 32px 32px 0;
    position: sticky; top: 0;
    background: linear-gradient(180deg, rgba(15,10,24,0.98) 60%, rgba(15,10,24,0));
    z-index: 2;
    padding-bottom: 24px;
  }
  .drawer-close {
    position: absolute; top: 24px; right: 24px;
    width: 32px; height: 32px; border-radius: 50%;
    background: rgba(255,255,255,0.06); border: 0.5px solid rgba(255,255,255,0.1);
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    color: var(--ink-1); font-size: 16px; line-height: 1;
    transition: all 0.2s;
  }
  .drawer-close:hover { background: rgba(255,255,255,0.1); color: var(--ink-0); }

  .drawer-eyebrow { font-size: 10px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--persona); margin-bottom: 14px; transition: color 0.6s ease; }
  .drawer-name { font-size: 32px; font-weight: 600; letter-spacing: -0.025em; margin-bottom: 4px; }
  .drawer-archetype { font-size: 12px; color: var(--ink-3); font-style: italic; margin-bottom: 14px; letter-spacing: 0.02em; }
  .drawer-tagline { font-family: "New York", Georgia, serif; font-style: italic; font-size: 16px; color: var(--ink-1); margin-bottom: 20px; line-height: 1.4; }

  /* Persona switcher tabs */
  .persona-tabs { display: flex; gap: 6px; padding: 0 32px 24px; flex-wrap: wrap; }
  .persona-tab {
    padding: 7px 13px; border-radius: 100px;
    font-size: 11px; font-weight: 600; letter-spacing: 0.02em;
    background: rgba(255,255,255,0.04); border: 0.5px solid rgba(255,255,255,0.08);
    color: var(--ink-2); cursor: pointer;
    transition: all 0.2s;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .persona-tab::before {
    content: ""; width: 7px; height: 7px; border-radius: 50%;
    background: var(--tab-color, var(--violet-400));
    box-shadow: 0 0 6px var(--tab-color, var(--violet-400));
  }
  .persona-tab:hover { color: var(--ink-0); background: rgba(255,255,255,0.07); }
  .persona-tab.active { color: var(--ink-0); background: var(--persona-soft); border-color: color-mix(in srgb, var(--persona) 35%, transparent); }

  .drawer-section { padding: 22px 32px; border-top: 0.5px solid rgba(255,255,255,0.06); }
  .drawer-section-title { font-size: 9px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 14px; }

  .attr-row { display: flex; gap: 16px; padding: 10px 0; font-size: 13px; }
  .attr-row + .attr-row { border-top: 0.5px solid rgba(255,255,255,0.04); }
  .attr-key { flex: 0 0 130px; color: var(--ink-3); font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.06em; padding-top: 1px; }
  .attr-val { color: var(--ink-1); flex: 1; line-height: 1.45; }

  .pref-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .pref-tag {
    padding: 4px 10px; border-radius: 100px; font-size: 11px; font-weight: 500;
    background: var(--persona-soft); color: var(--ink-1);
    border: 0.5px solid color-mix(in srgb, var(--persona) 25%, transparent);
    transition: all 0.6s ease;
  }
  .pref-tag.skip { background: rgba(255,90,80,0.08); border-color: rgba(255,90,80,0.18); color: rgba(255,200,195,0.85); }
  .pref-block { margin-bottom: 16px; }
  .pref-block-label { font-size: 10px; color: var(--ink-3); font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 4px; }
  .pref-block-value { font-size: 13px; color: var(--ink-1); line-height: 1.5; }

  /* ============= MODE SWITCH ============= */
  .mode-switch {
    position: fixed; top: 32px; left: 50%; transform: translateX(-50%);
    z-index: 200;
    display: flex;
    background: rgba(20,15,30,0.7);
    backdrop-filter: blur(28px) saturate(160%); -webkit-backdrop-filter: blur(28px) saturate(160%);
    border: 0.5px solid rgba(255,255,255,0.1);
    border-radius: 100px;
    padding: 4px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
  .mode-btn {
    padding: 8px 18px; border-radius: 100px;
    background: none; border: none;
    font-size: 12px; font-weight: 600; letter-spacing: 0.02em;
    color: var(--ink-2); cursor: pointer;
    transition: all 0.2s;
  }
  .mode-btn.active {
    background: rgba(255,255,255,0.08);
    color: var(--ink-0);
    box-shadow: inset 0 0 0 0.5px rgba(255,255,255,0.1);
  }

  /* ============= COMPARE MODE ============= */
  .compare-stage {
    position: fixed; inset: 0;
    display: none;
    flex-direction: column;
    background: var(--bg-0);
    z-index: 50;
    padding: 96px 56px 80px;
  }
  .compare-stage.active { display: flex; }

  .compare-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 22px;
  }
  .compare-card-title {
    font-size: 24px; font-weight: 600; letter-spacing: -0.02em;
  }
  .compare-card-meta {
    font-size: 12px; color: var(--ink-3); margin-top: 4px; letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .compare-nav {
    display: flex; align-items: center; gap: 12px;
  }
  .compare-nav-btn {
    width: 38px; height: 38px; border-radius: 50%;
    background: rgba(255,255,255,0.06);
    border: 0.5px solid rgba(255,255,255,0.1);
    color: var(--ink-1); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; transition: all 0.2s;
  }
  .compare-nav-btn:hover { background: rgba(255,255,255,0.1); color: var(--ink-0); }
  .compare-counter { font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; min-width: 44px; text-align: center; }

  .compare-grid {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 14px;
    min-height: 0;
  }
  .compare-cell {
    position: relative;
    border-radius: 16px;
    overflow: hidden;
    background-size: cover; background-position: center;
    cursor: default;
    transition: transform 0.3s, box-shadow 0.3s;
    --cell-color: var(--violet-400);
    --cell-glow: rgba(155,134,255,0.4);
  }
  .compare-cell:hover { transform: translateY(-2px); }
  .compare-cell::before {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(7,5,12,0.2) 0%, rgba(7,5,12,0) 30%, rgba(7,5,12,0.7) 70%, rgba(7,5,12,0.95) 100%);
  }
  .compare-cell-tag {
    position: absolute; top: 14px; left: 14px;
    display: inline-flex; align-items: center; gap: 7px;
    padding: 5px 11px; border-radius: 100px;
    background: rgba(15,10,24,0.7);
    backdrop-filter: blur(20px) saturate(160%);
    border: 0.5px solid color-mix(in srgb, var(--cell-color) 40%, rgba(255,255,255,0.14));
    font-size: 9.5px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--ink-0); z-index: 2;
  }
  .compare-cell-tag::before {
    content: ""; width: 6px; height: 6px; border-radius: 50%;
    background: var(--cell-color); box-shadow: 0 0 6px var(--cell-glow);
  }
  .compare-cell-content {
    position: absolute; bottom: 0; left: 0; right: 0;
    padding: 18px 22px 22px;
    z-index: 2;
  }
  .compare-cell-line {
    font-family: "New York", Georgia, serif; font-style: italic;
    font-size: 16px; line-height: 1.4;
    color: var(--ink-0);
    letter-spacing: -0.01em;
  }
  .compare-cell-cta {
    margin-top: 12px;
    display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 12px;
    background: rgba(15,10,24,0.6);
    backdrop-filter: blur(16px);
    border: 0.5px solid color-mix(in srgb, var(--cell-color) 35%, transparent);
    border-radius: 100px;
    font-family: "New York", Georgia, serif; font-style: italic;

  const p = getPersona(personaId);
  document.documentElement.style.setProperty('--persona', p.color);
  document.documentElement.style.setProperty('--persona-glow', p.glowColor);
  document.documentElement.style.setProperty('--persona-soft', hexToRgba(p.color, 0.16));
}

function hexToRgba(hex, a) {
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  return `rgba(${r},${g},${b},${a})`;
}

function clearTyping() { typingTimers.forEach(clearTimeout); typingTimers = []; }

// Typewriter
function typeSlow(el, text, onDone) {
  el.textContent = ''; let i = 0;
  (function tick() {
    if (i >= text.length) { if (onDone) onDone(); return; }
    el.textContent += text[i];
    const ch = text[i]; i++;
    let d = 32 + Math.random() * 22;
    if (ch === ',') d = 220;
    else if (ch === '.' || ch === '?' || ch === '!') d = 360;
    else if (ch === '—' || ch === ':' || ch === ';') d = 240;
    typingTimers.push(setTimeout(tick, d));
  })();
}

// ============= RENDER IMMERSIVE FEED =============
function renderFeed() {
  stage.innerHTML = '';
  DATA.cards.forEach((card, idx) => {
    const div = document.createElement('div');
    div.className = `card ${card.layout}`;
    div.dataset.idx = idx;
    div.innerHTML = `
      <div class="card-image" style="background-image: url('${card.image}')"></div>
      <div class="card-tag">${card.tag}</div>
      <div class="card-content">
        <div class="card-title">${card.title}</div>
        <div class="card-sub">${card.sub}</div>
        <div class="agent-line mood-${getActivePersona().defaultMood}">
          <span class="agent-mascot"></span>
          <span class="typed-text"></span>
        </div>
        <div class="card-actions">
          <div class="cta-button">
            <span class="cta-dock"></span>
            <span class="cta-question">${card.ctaQuestion[activePersonaId]}</span>
            <span class="cta-yes">Yes</span>
          </div>
        </div>
      </div>
    `;
    div.querySelector('.agent-mascot').appendChild(mascotTpl.content.cloneNode(true));
    stage.appendChild(div);
  });
}

function activateCard(idx, animateTyping = true) {
  clearTyping();
  activeCardIndex = idx;
  const cards = stage.querySelectorAll('.card');
  cards.forEach((c, i) => c.classList.toggle('active', i === idx));
  const card = DATA.cards[idx];
  document.getElementById('timeMark').textContent = card.timeLabel;

  const cardEl = cards[idx];
  const lineEl = cardEl.querySelector('.agent-line');
  const typedEl = cardEl.querySelector('.typed-text');
  const ctaBtn = cardEl.querySelector('.cta-button');
  const ctaQuestion = cardEl.querySelector('.cta-question');
  const text = card.agentLine[activePersonaId];

  // Reset
  ctaBtn.classList.remove('landed');
  typedEl.textContent = '';

  // Mood per persona
  lineEl.classList.remove('mood-curious','mood-confident','mood-proud','mood-thinking','mood-hesitant');
  lineEl.classList.add(`mood-${getActivePersona().defaultMood}`);

  // CTA
  ctaQuestion.textContent = card.ctaQuestion[activePersonaId];

  if (animateTyping) {
    setTimeout(() => {
      lineEl.classList.add('is-typing');
      typeSlow(typedEl, text, () => {
        lineEl.classList.remove('is-typing');
        setTimeout(() => ctaBtn.classList.add('landed'), 300);
      });
    }, 800);
  } else {
    typedEl.textContent = text;
    ctaBtn.classList.add('landed');
  }
}

// Live-swap reasoning on persona change for current card
function reswapCurrentCard() {
  if (mode !== 'immersive') return;
  const cards = stage.querySelectorAll('.card');
  const cardEl = cards[activeCardIndex];
  if (!cardEl) return;
  const card = DATA.cards[activeCardIndex];
  const lineEl = cardEl.querySelector('.agent-line');
  const typedEl = cardEl.querySelector('.typed-text');
  const ctaBtn = cardEl.querySelector('.cta-button');
  const ctaQuestion = cardEl.querySelector('.cta-question');

  // Update mood + CTA + tag colour will follow theme update automatically
  clearTyping();
  ctaBtn.classList.remove('landed');
  lineEl.classList.add('swapping');

  setTimeout(() => {
    typedEl.textContent = '';
    lineEl.classList.remove('swapping');
    lineEl.classList.remove('mood-curious','mood-confident','mood-proud','mood-thinking','mood-hesitant');
    lineEl.classList.add(`mood-${getActivePersona().defaultMood}`);
    ctaQuestion.textContent = card.ctaQuestion[activePersonaId];

    lineEl.classList.add('is-typing');
    typeSlow(typedEl, card.agentLine[activePersonaId], () => {
      lineEl.classList.remove('is-typing');
      setTimeout(() => ctaBtn.classList.add('landed'), 200);
    });
  }, 300);
}

// Also update other cards' CTA + mood (silently — they'll re-render their text on next activation)
function refreshAllCardsForPersona() {
  const cards = stage.querySelectorAll('.card');
  cards.forEach((cardEl, i) => {
    if (i === activeCardIndex) return; // current card handled separately
    const card = DATA.cards[i];
    const lineEl = cardEl.querySelector('.agent-line');
    const typedEl = cardEl.querySelector('.typed-text');
    const ctaQuestion = cardEl.querySelector('.cta-question');
    if (lineEl) {
      lineEl.classList.remove('mood-curious','mood-confident','mood-proud','mood-thinking','mood-hesitant');
      lineEl.classList.add(`mood-${getActivePersona().defaultMood}`);
    }
    if (typedEl) typedEl.textContent = '';
    if (ctaQuestion) ctaQuestion.textContent = card.ctaQuestion[activePersonaId];
  });
}

// ============= NAVIGATION =============
function nav(dir) {
  if (mode === 'compare') { navCompare(dir); return; }
  const newIdx = Math.max(0, Math.min(DATA.cards.length - 1, activeCardIndex + dir));
  if (newIdx === activeCardIndex) return;
  activateCard(newIdx, true);
}

function navCompare(dir) {
  compareCardIndex = (compareCardIndex + dir + DATA.cards.length) % DATA.cards.length;
  renderCompare();
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowDown' || e.key === 'ArrowRight') { e.preventDefault(); nav(1); }
  if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') { e.preventDefault(); nav(-1); }
  if (e.key === 'Escape') closeDrawer();
});

let wheelLock = false;
window.addEventListener('wheel', (e) => {
  if (drawerOpen) return;
  if (mode === 'compare') return; // compare uses arrow buttons
  if (wheelLock) return;
  if (Math.abs(e.deltaY) < 8) return;
  wheelLock = true;
  nav(e.deltaY > 0 ? 1 : -1);
  setTimeout(() => wheelLock = false, 800);
}, { passive: true });

// ============= PERSONA SWITCH =============
function switchPersona(id) {
  if (id === activePersonaId) return;
  activePersonaId = id;
  applyPersonaTheme(id);
  updatePersonaPill();
  updateDrawerPersona();
  refreshAllCardsForPersona();
  reswapCurrentCard();
  if (mode === 'compare') renderCompare();
}

function updatePersonaPill() {
  document.getElementById('personaPillName').textContent = getActivePersona().name;
}

// ============= DRAWER =============
function toggleDrawer() {
  drawerOpen = !drawerOpen;
  document.getElementById('personaDrawer').classList.toggle('open', drawerOpen);
  document.getElementById('drawerBackdrop').classList.toggle('show', drawerOpen);
  if (drawerOpen) updateDrawerPersona();
}
function closeDrawer() {
  drawerOpen = false;
  document.getElementById('personaDrawer').classList.remove('open');
  document.getElementById('drawerBackdrop').classList.remove('show');
}

function buildDrawerTabs() {
  const tabs = document.getElementById('personaTabs');
  tabs.innerHTML = '';
  DATA.personas.forEach(p => {
    const btn = document.createElement('button');
    btn.className = 'persona-tab' + (p.id === activePersonaId ? ' active' : '');
    btn.style.setProperty('--tab-color', p.color);
    btn.textContent = p.name;
    btn.onclick = () => switchPersona(p.id);
    tabs.appendChild(btn);
  });
}

function updateDrawerPersona() {
  const p = getActivePersona();
  document.getElementById('drawerName').textContent = p.name;
  document.getElementById('drawerArchetype').textContent = `Jungian root: ${p.archetype}`;
  document.getElementById('drawerTagline').textContent = `"${p.tagline}"`;
  document.getElementById('drawerSketch').textContent = p.sketch;

  // Attributes
  const attrs = document.getElementById('drawerAttrs');
  attrs.innerHTML = '';
  Object.entries(p.attributes).forEach(([k, v]) => {
    const row = document.createElement('div');
    row.className = 'attr-row';
    row.innerHTML = `<div class="attr-key">${k}</div><div class="attr-val">${v}</div>`;
    attrs.appendChild(row);
  });

  // Drawn to / Skips
  const dt = document.getElementById('drawerDrawnTo');
  dt.innerHTML = '';
  p.preferences['Drawn to'].forEach(t => {
    const tag = document.createElement('span'); tag.className = 'pref-tag'; tag.textContent = t;
    dt.appendChild(tag);
  });
  const sk = document.getElementById('drawerSkips');
  sk.innerHTML = '';
  p.preferences['Skips'].forEach(t => {
    const tag = document.createElement('span'); tag.className = 'pref-tag skip'; tag.textContent = t;
    sk.appendChild(tag);
  });
  document.getElementById('drawerTimeOfDay').textContent = p.preferences['Time of day'];

  // Inferred
  const inf = document.getElementById('drawerInferred');
  inf.innerHTML = '';
  Object.entries(p.inferred).forEach(([k, v]) => {
    const row = document.createElement('div');
    row.className = 'attr-row';
    row.innerHTML = `<div class="attr-key">${k}</div><div class="attr-val">${v}</div>`;
    inf.appendChild(row);
  });

  buildDrawerTabs();
}

// ============= MODE SWITCH =============
function setMode(newMode) {
  mode = newMode;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === newMode));
  const stage = document.getElementById('stage');
  const compareStage = document.getElementById('compareStage');
  if (newMode === 'immersive') {
    stage.style.display = '';
    compareStage.classList.remove('active');
    document.getElementById('scrollHint').textContent = '↑ ↓ to browse · click persona to switch';
    // Re-activate current card so typing replays
    setTimeout(() => activateCard(activeCardIndex, true), 100);
  } else {
    stage.style.display = 'none';
    compareStage.classList.add('active');
    document.getElementById('scrollHint').textContent = '◀ ▶ to browse cards · click persona to switch';
    compareCardIndex = activeCardIndex;
    renderCompare();
  }
}

// ============= COMPARE MODE =============
function renderCompare() {
  const card = DATA.cards[compareCardIndex];
  document.getElementById('compareTitle').innerHTML = card.title.replace('<br>', ' ');
  document.getElementById('compareMeta').textContent = `${card.tag} · ${card.timeLabel}`;
  document.getElementById('compareCounter').textContent = `${compareCardIndex + 1} / ${DATA.cards.length}`;

  const grid = document.getElementById('compareGrid');
  grid.innerHTML = '';
  DATA.personas.forEach(p => {
    const cell = document.createElement('div');
    cell.className = 'compare-cell';
    cell.style.backgroundImage = `url('${card.image}')`;
    cell.style.setProperty('--cell-color', p.color);
    cell.style.setProperty('--cell-glow', p.glowColor);
    cell.innerHTML = `
      <div class="compare-cell-tag">${p.name}</div>
      <div class="compare-cell-content">
        <div class="compare-cell-line">${card.agentLine[p.id]}</div>
        <div class="compare-cell-cta">${card.ctaQuestion[p.id]}</div>
      </div>
    `;
    grid.appendChild(cell);
  });
}

// ============= INIT =============
function init() {
  applyPersonaTheme(activePersonaId);
  updatePersonaPill();
  buildDrawerTabs();
  renderFeed();
  setTimeout(() => activateCard(0, true), 200);
}
init();
</script>
</body>
